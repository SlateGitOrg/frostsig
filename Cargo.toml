[package]
name = "frostsig"
version = "0.1.0"
edition = "2021"
description = "FROST threshold Schnorr signatures (RFC 9591) over Ed25519 and ristretto255 - educational implementation"
license = "MIT"
readme = "README.md"
keywords = ["frost", "threshold", "schnorr", "ed25519", "ristretto"]
categories = ["cryptography"]
publish = false

[lib]
name = "frostsig"
path = "src/lib.rs"

[[bin]]
name = "frostsig"
path = "src/main.rs"

[dependencies]
curve25519-dalek = { version = "=4.1.3", features = ["rand_core", "zeroize", "alloc", "precomputed-tables"] }
ed25519-dalek = { version = "=2.1.1" }
sha2 = "=0.10.8"
subtle = "=2.6.1"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
rand_chacha = "=0.3.1"
zeroize = { version = "=1.8.1", features = ["zeroize_derive"] }
thiserror = "=1.0.69"
hex = "=0.4.3"
log = "=0.4.22"
clap = { version = "=4.5.20", features = ["derive"] }
env_logger = { version = "=0.11.5", default-features = false, features = ["auto-color"] }
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

[dev-dependencies]
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }
tempfile = "=3.13.0"

[[bench]]
name = "frost"
harness = false

# Keep the curve arithmetic fast in debug/test builds so property tests stay quick.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
